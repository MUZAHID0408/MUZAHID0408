<svg width="800" height="190" viewBox="0 0 800 190" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="pulsGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="pb0"><rect x="600" y="48" width="180" height="18"/></clipPath>
    <clipPath id="pb1"><rect x="600" y="98" width="180" height="18"/></clipPath>
    <clipPath id="pb2"><rect x="600" y="148" width="180" height="18"/></clipPath>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;700&amp;display=swap');

    /* ══ THEME TOKENS ══ (light = default, dark = media query) */
    :root{
      --g: #078a57;   /* green  – ACTIVE    */
      --a: #9a6700;   /* amber  – DEVELOPING */
      --r: #cf222e;   /* red    – BUILDING   */
      --hdr:   rgba(5,110,70,0.90);
      --idx:   rgba(7,138,87,0.70);
      --flash: #1f2328;
      --task:  rgba(31,35,40,0.90);
      --edge:  rgba(31,35,40,0.18);
      --div:   rgba(31,35,40,0.10);
      --track: rgba(31,35,40,0.20);
      --bar:   0.75;
      --pbop:  0.30;   /* progress fill  */
      --bgop:  0.09;   /* badge bg       */
      --bdop:  0.60;   /* badge border   */
      --glyph: 0.70;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --g: #4af0a0;
        --a: #f0b84a;
        --r: #f06060;
        --hdr:   rgba(74,240,160,0.65);
        --idx:   rgba(74,240,160,0.45);
        --flash: #ffffff;
        --task:  rgba(232,232,234,0.80);
        --edge:  rgba(255,255,255,0.09);
        --div:   rgba(255,255,255,0.06);
        --track: rgba(255,255,255,0.08);
        --bar:   0.5;
        --pbop:  0.35;
        --bgop:  0.07;
        --bdop:  0.30;
        --glyph: 0.50;
      }
    }

    @keyframes accGrow{ 0%{height:0} 100%{height:190px} }
    @keyframes hdrDecode{
      0%  {opacity:0;letter-spacing:12px;filter:blur(4px)}
      50% {opacity:0.7;letter-spacing:5px;filter:blur(1px)}
      100%{opacity:1;letter-spacing:3px;filter:blur(0)}
    }
    @keyframes rowSlide{
      0%  {opacity:0;transform:translateX(-24px)}
      65% {transform:translateX(3px)}
      82% {transform:translateX(-1px)}
      100%{opacity:1;transform:translateX(0)}
    }
    @keyframes idxFlash{
      0%  {fill:var(--g);opacity:0;transform:scale(1.5)}
      30% {fill:var(--flash);opacity:1;transform:scale(1.08)}
      60% {fill:var(--g);transform:scale(1)}
      100%{fill:var(--idx)}
    }
    @keyframes typeIn{
      0%  {clip-path:inset(0 100% 0 0);opacity:0}
      4%  {opacity:1}
      100%{clip-path:inset(0 0% 0 0)}
    }
    @keyframes pbFill{
      0%  {width:0px;opacity:1}
      70% {width:186px;opacity:1}
      90% {width:186px;opacity:0}
      100%{width:0px;opacity:0}
    }
    @keyframes badgeIn{
      0%  {opacity:0;transform:scaleX(0.4) translateX(20px)}
      70% {opacity:0}
      80% {opacity:1;transform:scaleX(1.05) translateX(-1px)}
      100%{opacity:1;transform:scaleX(1) translateX(0)}
    }
    @keyframes radarPing{
      0%  {r:3;opacity:0.9;stroke-width:2}
      70% {r:10;opacity:0;stroke-width:0.5}
      100%{r:3;opacity:0}
    }
    @keyframes dotBlink{0%,100%{opacity:1}50%{opacity:0.4}}
    @keyframes divCenter{
      0%  {clip-path:inset(0 50% 0 50%)}
      100%{clip-path:inset(0 0% 0 0%)}
    }

    .acc-bar { animation:accGrow 0.5s cubic-bezier(.22,1,.36,1) 0s both }
    .hdr     { animation:hdrDecode 0.7s ease 0.08s both }
    .row0 { animation:rowSlide 0.55s cubic-bezier(.22,1,.36,1) 0.20s both }
    .idx0 { animation:idxFlash 0.6s ease 0.22s both; transform-origin:18px 52px }
    .tw0a { animation:typeIn 0.8s steps(60,end) 0.30s both }
    .tw0b { animation:typeIn 0.3s steps(17,end) 1.10s both }
    .pb0-fill { animation:pbFill 1.4s ease 0.90s both }
    .badge0 { animation:badgeIn 1.4s ease 0.90s both }
    .row1 { animation:rowSlide 0.55s cubic-bezier(.22,1,.36,1) 0.45s both }
    .idx1 { animation:idxFlash 0.6s ease 0.47s both; transform-origin:18px 112px }
    .tw1a { animation:typeIn 0.6s steps(38,end) 0.55s both }
    .pb1-fill { animation:pbFill 1.2s ease 1.10s both }
    .badge1 { animation:badgeIn 1.2s ease 1.10s both }
    .row2 { animation:rowSlide 0.55s cubic-bezier(.22,1,.36,1) 0.70s both }
    .idx2 { animation:idxFlash 0.6s ease 0.72s both; transform-origin:18px 152px }
    .tw2a { animation:typeIn 0.8s steps(59,end) 0.80s both }
    .tw2b { animation:typeIn 0.3s steps(13,end) 1.60s both }
    .pb2-fill { animation:pbFill 1.1s ease 1.30s both }
    .badge2 { animation:badgeIn 1.1s ease 1.30s both }
    .ring0   { animation:radarPing 2.4s ease-out 2.5s infinite }
    .dot0    { animation:dotBlink  1.9s ease-in-out 2.5s infinite }
    .div0    { animation:divCenter 0.5s ease 0.35s both }
    .div1    { animation:divCenter 0.5s ease 0.60s both }

    /* colour hooks */
    .edge{stroke:var(--edge)}
    .dv{stroke:var(--div)}
    .track{fill:none;stroke:var(--track)}
    .acc-bar{fill:var(--g);opacity:var(--bar)}
    .g-fill{fill:var(--g)} .a-fill{fill:var(--a)} .r-fill{fill:var(--r)}
    .g-fill-solid{fill:var(--g)}
    .g-stroke{stroke:var(--g)} .a-stroke{stroke:var(--a)} .r-stroke{stroke:var(--r)}
    .pbop{fill-opacity:var(--pbop)}
    .bdg{fill-opacity:var(--bgop);stroke-opacity:var(--bdop)}
    .g-text{fill:var(--g)} .a-text{fill:var(--a)} .r-text{fill:var(--r)}

    /* text styles (sizes +3) */
    .hdr-txt {font-family:'Roboto Mono',monospace;font-size:12px;fill:var(--hdr);letter-spacing:3px}
    .idx-txt {font-family:'Roboto Mono',monospace;font-size:12px;font-weight:700;fill:var(--idx)}
    .task    {font-family:'Roboto Mono',monospace;font-size:14px;fill:var(--task)}
    .badge-t {font-family:'Roboto Mono',monospace;font-size:11px;text-anchor:middle}
    .glyph   {font-family:'Roboto Mono',monospace;font-size:10px;opacity:var(--glyph)}
  </style>

  <!-- Border rules -->
  <line class="edge" x1="0" y1="0"   x2="800" y2="0"   stroke-width="0.7"/>
  <line class="edge" x1="0" y1="190" x2="800" y2="190" stroke-width="0.7"/>

  <!-- Left accent bar -->
  <rect class="acc-bar" x="0" y="0" width="3" height="190"/>

  <!-- Header -->
  <text class="hdr-txt hdr" x="14" y="20">// CURRENT</text>

  <!-- ═══════════ ROW 1 ═══════════ -->
  <g class="row0">
    <text class="idx-txt idx0" x="14" y="52">01</text>
  </g>
  <g class="tw0a"><text class="task" x="40" y="52">Research on developing machine learning models for analyzing</text></g>
  <g class="tw0b"><text class="task" x="40" y="72">climate change...</text></g>

  <rect class="track" x="598" y="47" width="186" height="20" rx="3" stroke-width="0.7"/>
  <g clip-path="url(#pb0)">
    <rect class="pb0-fill g-fill pbop" x="600" y="50" height="14" rx="2"/>
  </g>
  <g class="badge0">
    <rect class="g-fill g-stroke bdg" x="598" y="47" width="186" height="20" rx="3" stroke-width="0.8"/>
    <circle class="ring0 g-stroke" cx="612" cy="57" r="3" fill="none"/>
    <circle class="dot0 g-fill-solid" cx="612" cy="57" r="3" filter="url(#pulsGlow)"/>
    <text class="badge-t g-text" x="701" y="61">ACTIVE</text>
    <text class="glyph g-text" x="622" y="60.5">■ ■ ■</text>
  </g>

  <line class="dv div0" x1="14" y1="86" x2="786" y2="86" stroke-width="0.6"/>

  <!-- ═══════════ ROW 2 ═══════════ -->
  <g class="row1">
    <text class="idx-txt idx1" x="14" y="112">02</text>
  </g>
  <g class="tw1a"><text class="task" x="40" y="112">Developing useful apps library tool...</text></g>

  <rect class="track" x="598" y="97" width="186" height="20" rx="3" stroke-width="0.7"/>
  <g clip-path="url(#pb1)">
    <rect class="pb1-fill a-fill pbop" x="600" y="100" height="14" rx="2"/>
  </g>
  <g class="badge1">
    <rect class="a-fill a-stroke bdg" x="598" y="97" width="186" height="20" rx="3" stroke-width="0.8"/>
    <text class="badge-t a-text" x="691" y="111">DEVELOPING</text>
    <text class="glyph a-text" x="610" y="110.5">▶ ▶ ·</text>
  </g>

  <line class="dv div1" x1="14" y1="127" x2="786" y2="127" stroke-width="0.6"/>

  <!-- ═══════════ ROW 3 ═══════════ -->
  <g class="row2">
    <text class="idx-txt idx2" x="14" y="152">03</text>
  </g>
  <g class="tw2a"><text class="task" x="40" y="152">FullStack depth - more structural understanding is required</text></g>
  <g class="tw2b"><text class="task" x="40" y="172">now a days...</text></g>

  <rect class="track" x="598" y="147" width="186" height="20" rx="3" stroke-width="0.7"/>
  <g clip-path="url(#pb2)">
    <rect class="pb2-fill r-fill pbop" x="600" y="150" height="14" rx="2"/>
  </g>
  <g class="badge2">
    <rect class="r-fill r-stroke bdg" x="598" y="147" width="186" height="20" rx="3" stroke-width="0.8"/>
    <text class="badge-t r-text" x="691" y="161">BUILDING</text>
    <text class="glyph r-text" x="610" y="160.5">◆ ◆ ◆</text>
  </g>
</svg>
