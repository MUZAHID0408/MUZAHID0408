<svg width="800" height="170" viewBox="0 0 800 170" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="bpGlow">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="accentGlw">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;700&amp;display=swap');

    /* ══ THEME TOKENS ══ (light = default, dark = media query) */
    :root{
      --accent: #078a57;
      --hdr:    rgba(5,110,70,0.90);
      --status: #066b47;
      --ttl:    #1f2328;
      --desc:   rgba(31,35,40,0.72);
      --coord:  rgba(5,110,70,0.55);
      --edge:   rgba(31,35,40,0.18);
      --cardedge: rgba(31,35,40,0.28);
      --bar:    0.75;
      --inner:  0.90;
      --grid:   0.10;
      --cardbg: 0.05;
      --xh:     0.70;
      --meas:   0.45;
      --tick:   0.55;
      --pillbg: 0.10;
      --pillbd: 0.55;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --accent: #4af0a0;
        --hdr:    rgba(74,240,160,0.65);
        --status: rgba(74,240,160,0.85);
        --ttl:    #e8e8ea;
        --desc:   rgba(232,232,234,0.60);
        --coord:  rgba(74,240,160,0.35);
        --edge:   rgba(255,255,255,0.09);
        --cardedge: rgba(255,255,255,0.12);
        --bar:    0.5;
        --inner:  0.6;
        --grid:   0.035;
        --cardbg: 0.02;
        --xh:     0.30;
        --meas:   0.15;
        --tick:   0.20;
        --pillbg: 0.07;
        --pillbd: 0.22;
      }
      .glow{filter:url(#bpGlow)}
      .acc-bar{filter:url(#accentGlw)}
    }

    @keyframes bpUnfold{
      0%  {clip-path:inset(50% 0 50% 0);opacity:0}
      25% {opacity:1}
      100%{clip-path:inset(0% 0 0% 0);opacity:1}
    }
    @keyframes borderTrace{0%{stroke-dashoffset:1000}100%{stroke-dashoffset:0}}
    @keyframes innerAcc{
      0%  {transform:scaleY(0);transform-origin:top}
      60% {transform:scaleY(1.04)}
      100%{transform:scaleY(1)}
    }
    @keyframes gridFadeIn{0%{opacity:0}100%{opacity:var(--grid)}}
    @keyframes crossH{0%{stroke-dashoffset:20}100%{stroke-dashoffset:0}}
    @keyframes statusSpring{
      0%  {opacity:0;transform:scale(0.4) translateX(-8px)}
      65% {transform:scale(1.06) translateX(1px)}
      100%{opacity:1;transform:scale(1) translateX(0)}
    }
    @keyframes titleWipe{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 0% 0 0)}}
    @keyframes descFade{
      0%  {opacity:0;transform:translateY(5px)}
      100%{opacity:1;transform:translateY(0)}
    }
    @keyframes measDraw{0%{stroke-dashoffset:40}100%{stroke-dashoffset:0}}
    @keyframes chipSlide{
      0%  {opacity:0;transform:translateX(-12px)}
      60% {transform:translateX(2px)}
      100%{opacity:1;transform:translateX(0)}
    }
    @keyframes hdrDecode{
      0%  {opacity:0;letter-spacing:10px;filter:blur(4px)}
      100%{opacity:1;letter-spacing:3px;filter:blur(0)}
    }
    @keyframes accExtend{0%{height:0}100%{height:170px}}

    .acc-bar  { animation:accExtend  0.5s ease 0s both }
    .hdr-lbl  { animation:hdrDecode  0.6s ease 0.08s both }

    .card0-bg    { animation:bpUnfold   0.7s cubic-bezier(.22,1,.36,1) 0.18s both }
    .border0     { stroke-dasharray:1000; animation:borderTrace 0.8s ease 0.22s both }
    .inner-acc0  { animation:innerAcc    0.5s ease 0.55s both }
    .grid0       { animation:gridFadeIn  0.4s ease 0.30s both }
    .status0     { animation:statusSpring 0.5s cubic-bezier(.34,1.56,.64,1) 0.75s both; transform-origin:28px 130px }
    .title0      { animation:titleWipe   0.7s steps(31,end) 0.60s both }
    .desc0a      { animation:descFade    0.4s ease 0.80s both }
    .desc0b      { animation:descFade    0.4s ease 0.92s both }
    .chip0       { animation:chipSlide   0.4s ease 1.04s both }
    .meas0       { stroke-dasharray:40;  animation:measDraw   0.3s ease 0.65s both }
    .xhair0      { stroke-dasharray:20;  animation:crossH     0.3s ease 0.50s both }

    .card1-bg    { animation:bpUnfold   0.7s cubic-bezier(.22,1,.36,1) 0.38s both }
    .border1     { stroke-dasharray:1000; animation:borderTrace 0.8s ease 0.42s both }
    .inner-acc1  { animation:innerAcc    0.5s ease 0.72s both }
    .grid1       { animation:gridFadeIn  0.4s ease 0.50s both }
    .status1     { animation:statusSpring 0.5s cubic-bezier(.34,1.56,.64,1) 0.92s both; transform-origin:426px 130px }
    .title1      { animation:titleWipe   0.7s steps(30,end) 0.78s both }
    .desc1a      { animation:descFade    0.4s ease 0.98s both }
    .desc1b      { animation:descFade    0.4s ease 1.10s both }
    .chip1       { animation:chipSlide   0.4s ease 1.22s both }
    .meas1       { stroke-dasharray:40;  animation:measDraw   0.3s ease 0.82s both }
    .xhair1      { stroke-dasharray:20;  animation:crossH     0.3s ease 0.67s both }

    /* colour hooks */
    .acc-f{fill:var(--accent)}
    .acc-s{stroke:var(--accent)}
    .edge{stroke:var(--edge)}
    .acc-bar{fill:var(--accent);opacity:var(--bar)}
    .innerbar{opacity:var(--inner)}
    .cardbg{fill-opacity:var(--cardbg)}
    .cardedge{stroke:var(--cardedge)}
    .gridg{opacity:var(--grid)}
    .xh{stroke-opacity:var(--xh)}
    .meas{stroke-opacity:var(--meas)}
    .tick{stroke-opacity:var(--tick)}
    .pill{fill-opacity:var(--pillbg);stroke-opacity:var(--pillbd)}

    /* text styles (sizes +3; coordinates +2) */
    .hdr   {font-family:'Roboto Mono',monospace;font-size:12px;fill:var(--hdr);letter-spacing:3px}
    .status{font-family:'Roboto Mono',monospace;font-size:11px;fill:var(--status);letter-spacing:1.5px}
    .ttl   {font-family:'Roboto Mono',monospace;font-size:15px;font-weight:700;fill:var(--ttl)}
    .desc  {font-family:'Roboto Mono',monospace;font-size:12.5px;fill:var(--desc);letter-spacing:0.3px}
    .chip  {font-family:'Roboto Mono',monospace;font-size:11px;fill:var(--accent);text-anchor:middle}
    .coord {font-family:'Roboto Mono',monospace;font-size:9px;fill:var(--coord);letter-spacing:0.5px}
  </style>

  <!-- Border rules -->
  <line class="edge" x1="0" y1="0"   x2="800" y2="0"   stroke-width="0.7"/>
  <line class="edge" x1="0" y1="170" x2="800" y2="170" stroke-width="0.7"/>

  <!-- Left accent bar -->
  <rect class="acc-bar" x="0" y="0" width="3"/>

  <!-- Header -->
  <text class="hdr hdr-lbl" x="14" y="20">// RESEARCH</text>

  <!-- ════════════════════ CARD 0 ════════════════════ -->
  <g class="grid0 gridg">
    <line class="acc-s" x1="14" y1="55" x2="388" y2="55" stroke-width="0.4"/>
    <line class="acc-s" x1="14" y1="80" x2="388" y2="80" stroke-width="0.4"/>
    <line class="acc-s" x1="14" y1="105" x2="388" y2="105" stroke-width="0.4"/>
    <line class="acc-s" x1="14" y1="130" x2="388" y2="130" stroke-width="0.4"/>
    <line class="acc-s" x1="80" y1="30" x2="80" y2="154" stroke-width="0.4"/>
    <line class="acc-s" x1="200" y1="30" x2="200" y2="154" stroke-width="0.4"/>
    <line class="acc-s" x1="320" y1="30" x2="320" y2="154" stroke-width="0.4"/>
  </g>

  <g class="card0-bg">
    <rect class="acc-f cardbg" x="14" y="30" width="374" height="124" rx="2"/>
  </g>

  <rect class="border0 cardedge" x="14" y="30" width="374" height="124" rx="2" fill="none" stroke-width="0.9"/>
  <rect class="inner-acc0 acc-f glow innerbar" x="14" y="30" width="3" height="124" rx="1"/>

  <text class="coord" x="16" y="28">0,0</text>
  <text class="coord" x="360" y="28">374,0</text>
  <text class="coord" x="16" y="162">0,124</text>

  <line class="xhair0 acc-s xh" x1="388" y1="30" x2="388" y2="44" stroke-width="0.9"/>
  <line class="xhair0 acc-s xh" x1="374" y1="30" x2="388" y2="30" stroke-width="0.9"/>

  <line class="meas0 acc-s meas" x1="14" y1="26" x2="388" y2="26" stroke-width="0.6"/>
  <line class="acc-s tick" x1="14" y1="23" x2="14" y2="30" stroke-width="0.6"/>
  <line class="acc-s tick" x1="388" y1="23" x2="388" y2="30" stroke-width="0.6"/>

  <g class="status0">
    <rect class="acc-f acc-s pill" x="28" y="38" width="164" height="18" rx="2" stroke-width="0.7"/>
    <text class="status" x="110" y="51" text-anchor="middle">THESIS · COMPLETED</text>
  </g>

  <g class="title0">
    <text class="ttl" x="28" y="78">Climate and Disaster Prediction</text>
  </g>

  <text class="desc desc0a" x="28" y="97">ML models on time series data</text>
  <text class="desc desc0b" x="28" y="114">Flood · Cyclone · Drought · Wildfire</text>

  <g class="chip0">
    <rect class="acc-f acc-s pill" x="28" y="124" width="92" height="20" rx="2" stroke-width="0.7"/>
    <text class="chip" x="74" y="138">data-sparse</text>
  </g>

  <!-- ════════════════════ CARD 1 ════════════════════ -->
  <g class="grid1 gridg">
    <line class="acc-s" x1="412" y1="55" x2="786" y2="55" stroke-width="0.4"/>
    <line class="acc-s" x1="412" y1="80" x2="786" y2="80" stroke-width="0.4"/>
    <line class="acc-s" x1="412" y1="105" x2="786" y2="105" stroke-width="0.4"/>
    <line class="acc-s" x1="412" y1="130" x2="786" y2="130" stroke-width="0.4"/>
    <line class="acc-s" x1="478" y1="30" x2="478" y2="154" stroke-width="0.4"/>
    <line class="acc-s" x1="598" y1="30" x2="598" y2="154" stroke-width="0.4"/>
    <line class="acc-s" x1="718" y1="30" x2="718" y2="154" stroke-width="0.4"/>
  </g>

  <g class="card1-bg">
    <rect class="acc-f cardbg" x="412" y="30" width="374" height="124" rx="2"/>
  </g>

  <rect class="border1 cardedge" x="412" y="30" width="374" height="124" rx="2" fill="none" stroke-width="0.9"/>
  <rect class="inner-acc1 acc-f glow innerbar" x="412" y="30" width="3" height="124" rx="1"/>

  <text class="coord" x="414" y="28">412,0</text>
  <text class="coord" x="759" y="28">786,0</text>
  <text class="coord" x="414" y="162">412,124</text>

  <line class="xhair1 acc-s xh" x1="786" y1="30" x2="786" y2="44" stroke-width="0.9"/>
  <line class="xhair1 acc-s xh" x1="772" y1="30" x2="786" y2="30" stroke-width="0.9"/>

  <line class="meas1 acc-s meas" x1="412" y1="26" x2="786" y2="26" stroke-width="0.6"/>
  <line class="acc-s tick" x1="412" y1="23" x2="412" y2="30" stroke-width="0.6"/>
  <line class="acc-s tick" x1="786" y1="23" x2="786" y2="30" stroke-width="0.6"/>

  <g class="status1">
    <rect class="acc-f acc-s pill" x="426" y="38" width="140" height="18" rx="2" stroke-width="0.7"/>
    <text class="status" x="496" y="51" text-anchor="middle">PUBLISHED · NLP</text>
  </g>

  <g class="title1">
    <text class="ttl" x="426" y="78">Gemma-3 on Bangla Instructions</text>
  </g>

  <text class="desc desc1a" x="426" y="97">Dataset quality over model size</text>
  <text class="desc desc1b" x="426" y="114">Low-resource NLP behavior</text>

  <g class="chip1">
    <rect class="acc-f acc-s pill" x="426" y="124" width="100" height="20" rx="2" stroke-width="0.7"/>
    <text class="chip" x="476" y="138">low-resource</text>
  </g>
</svg>
