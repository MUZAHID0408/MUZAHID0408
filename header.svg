<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSm">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;700&amp;display=swap');

    /* ══ THEME TOKENS ══ (light = default, dark = media query) */
    :root{
      --name:   #1f2328;                 /* main name text            */
      --accent: #078a57;                 /* green: dot, cursor, lines */
      --role:   rgba(31,35,40,0.70);     /* RESEARCHER · DEVELOPER... */
      --sub:    rgba(5,110,70,0.90);     /* university line           */
      --mail:   rgba(31,35,40,0.60);     /* email                     */
      --rule:   rgba(31,35,40,0.20);     /* bottom divider            */
      --scan:   rgba(7,138,87,0.10);     /* scanline sweep            */
      --grid-h: 0.10;
      --grid-v: 0.08;
      --sig:    0.85;
      --brk:    0.85;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --name:   #e8e8ea;
        --accent: #4af0a0;
        --role:   rgba(232,232,234,0.55);
        --sub:    rgba(74,240,160,0.75);
        --mail:   rgba(232,232,234,0.40);
        --rule:   rgba(255,255,255,0.10);
        --scan:   rgba(74,240,160,0.06);
        --grid-h: 0.04;
        --grid-v: 0.03;
        --sig:    0.60;
        --brk:    0.70;
      }
    }

    /* colour hooks */
    .nm      { fill:var(--name) }
    .acc-f   { fill:var(--accent) }
    .acc-s   { stroke:var(--accent) }
    .role-t  { fill:var(--role) }
    .sub-t   { fill:var(--sub) }
    .mail-t  { fill:var(--mail) }
    .rule-s  { stroke:var(--rule) }
    .scan-f  { fill:var(--scan) }

    /* ── Signal oscilloscope sweep ── */
    @keyframes sigSweep{
      0%  {stroke-dashoffset:1200;opacity:0}
      8%  {opacity:var(--sig)}
      100%{stroke-dashoffset:0;opacity:var(--sig)}
    }
    @keyframes gridFadeH{0%{opacity:0}100%{opacity:var(--grid-h)}}
    @keyframes gridFadeV{0%{opacity:0}100%{opacity:var(--grid-v)}}

    @keyframes brkTL{0%{stroke-dashoffset:60}100%{stroke-dashoffset:0}}
    @keyframes brkBR{0%{stroke-dashoffset:60}100%{stroke-dashoffset:0}}

    /* ── Name: soft rise-in, staggered ── */
    @keyframes rise{
      0%  {opacity:0;transform:translateY(16px);filter:blur(5px)}
      60% {opacity:1;filter:blur(0)}
      100%{opacity:1;transform:translateY(0);filter:blur(0)}
    }
    /* ── Underline grows from centre ── */
    @keyframes growLine{
      0%  {transform:scaleX(0);opacity:0}
      100%{transform:scaleX(1);opacity:0.9}
    }

    @keyframes dotPulse{
      0%  {opacity:0;transform:scale(0)}
      60% {transform:scale(1.15)}
      80% {transform:scale(0.95)}
      100%{opacity:1;transform:scale(1)}
    }
    @keyframes blink{0%,100%{opacity:0.8}50%{opacity:0}}
    @keyframes scanReveal{
      0%  {clip-path:inset(0 100% 0 0);opacity:0}
      5%  {opacity:1}
      100%{clip-path:inset(0 0% 0 0);opacity:1}
    }
    @keyframes upFade{
      0%  {opacity:0;transform:translateY(8px)}
      100%{opacity:1;transform:translateY(0)}
    }
    @keyframes ruleR{0%{stroke-dashoffset:-820}100%{stroke-dashoffset:0}}
    @keyframes tickSeq{0%{transform:scaleY(0);opacity:0}60%{transform:scaleY(1.2)}100%{transform:scaleY(1);opacity:0.6}}
    @keyframes scanline{
      0%  {transform:translateY(-200px);opacity:0.6}
      100%{transform:translateY(200px);opacity:0}
    }

    /* Assign animations */
    .grid-h { animation:gridFadeH 0.4s ease 0.05s both }
    .grid-v { animation:gridFadeV 0.4s ease 0.12s both }

    .brk-tl { stroke-dasharray:60; animation:brkTL 0.4s ease 0.02s both }
    .brk-br { stroke-dasharray:60; animation:brkBR 0.4s ease 0.08s both }

    .sig { stroke-dasharray:1200; animation:sigSweep 1.1s cubic-bezier(.16,1,.3,1) 0s both }

    .l0 { animation:rise 0.7s cubic-bezier(.22,1,.36,1) 0.55s both }
    .l1 { animation:rise 0.7s cubic-bezier(.22,1,.36,1) 0.62s both }
    .l2 { animation:rise 0.7s cubic-bezier(.22,1,.36,1) 0.69s both }
    .l3 { animation:rise 0.7s cubic-bezier(.22,1,.36,1) 0.76s both }
    .l4 { animation:rise 0.7s cubic-bezier(.22,1,.36,1) 0.83s both }
    .l5 { animation:rise 0.7s cubic-bezier(.22,1,.36,1) 0.90s both }
    .l6 { animation:rise 0.7s cubic-bezier(.22,1,.36,1) 0.97s both }

    .dot-acc { animation:dotPulse 0.5s cubic-bezier(.34,1.56,.64,1) 1.4s both; transform-origin:540px 105px }
    .uline { animation:growLine 0.8s cubic-bezier(.22,1,.36,1) 1.25s both; transform-origin:400px 134px }
    .cur { animation:blink 1.1s step-end 1.6s infinite }

    .rule-r { stroke-dasharray:820; animation:ruleR 0.9s cubic-bezier(.22,1,.36,1) 0.8s both }

    .tk0 { animation:tickSeq 0.25s ease 0.85s both; transform-origin:200px 56px }
    .tk1 { animation:tickSeq 0.25s ease 0.92s both; transform-origin:400px 56px }
    .tk2 { animation:tickSeq 0.25s ease 0.99s both; transform-origin:600px 56px }

    .role { animation:scanReveal 1.1s steps(30,end) 1.3s both }
    .sub0 { animation:upFade 0.6s ease 1.55s both }
    .sub1 { animation:upFade 0.6s ease 1.72s both }
    .scan { animation:scanline 0.55s linear 0.45s both }
  </style>

  <!-- Background grid -->
  <g class="grid-h">
    <line class="acc-s" x1="0" y1="50"  x2="800" y2="50"  stroke-width="0.4"/>
    <line class="acc-s" x1="0" y1="100" x2="800" y2="100" stroke-width="0.4"/>
    <line class="acc-s" x1="0" y1="150" x2="800" y2="150" stroke-width="0.4"/>
  </g>
  <g class="grid-v">
    <line class="acc-s" x1="133" y1="0" x2="133" y2="200" stroke-width="0.4"/>
    <line class="acc-s" x1="266" y1="0" x2="266" y2="200" stroke-width="0.4"/>
    <line class="acc-s" x1="400" y1="0" x2="400" y2="200" stroke-width="0.4"/>
    <line class="acc-s" x1="533" y1="0" x2="533" y2="200" stroke-width="0.4"/>
    <line class="acc-s" x1="666" y1="0" x2="666" y2="200" stroke-width="0.4"/>
  </g>

  <!-- Scanline sweep -->
  <rect class="scan scan-f" x="0" y="0" width="800" height="4"/>

  <!-- Corner brackets -->
  <path class="brk-tl acc-s" d="M22 36 L22 12 L58 12"     stroke-width="1.4" fill="none" opacity="0.85"/>
  <path class="brk-tl acc-s" d="M778 36 L778 12 L742 12"   stroke-width="1.4" fill="none" opacity="0.85"/>
  <path class="brk-br acc-s" d="M22 164 L22 188 L58 188"   stroke-width="1.4" fill="none" opacity="0.85"/>
  <path class="brk-br acc-s" d="M778 164 L778 188 L742 188" stroke-width="1.4" fill="none" opacity="0.85"/>

  <!-- Oscilloscope signal -->
  <path class="sig acc-s" d="M24 56 L80 56 L86 44 L92 68 L98 44 L104 68 L108 56 L160 56 L164 50 L168 62 L172 56 L220 56 L224 48 L228 64 L232 56 L400 56 L404 52 L408 60 L412 56 L600 56 L604 50 L608 62 L612 56 L784 56"
    stroke-width="1" fill="none" filter="url(#glowSm)"/>

  <!-- Bottom rule -->
  <line class="rule-r rule-s" x1="24" y1="145" x2="784" y2="145" stroke-width="0.7"/>

  <!-- Tick marks -->
  <line class="tk0 acc-s" x1="200" y1="52" x2="200" y2="60" stroke-width="1.2"/>
  <line class="tk1 acc-s" x1="400" y1="52" x2="400" y2="60" stroke-width="1.2"/>
  <line class="tk2 acc-s" x1="600" y1="52" x2="600" y2="60" stroke-width="1.2"/>

  <!-- NAME (centred) -->
  <text class="l0 nm" x="223.5" y="122" font-family="'Roboto Mono',monospace" font-size="58" font-weight="700">M</text>
  <text class="l1 nm" x="266.3" y="122" font-family="'Roboto Mono',monospace" font-size="58" font-weight="700">U</text>
  <text class="l2 nm" x="309.1" y="122" font-family="'Roboto Mono',monospace" font-size="58" font-weight="700">Z</text>
  <text class="l3 nm" x="351.9" y="122" font-family="'Roboto Mono',monospace" font-size="58" font-weight="700">A</text>
  <text class="l4 nm" x="394.7" y="122" font-family="'Roboto Mono',monospace" font-size="58" font-weight="700">H</text>
  <text class="l5 nm" x="437.5" y="122" font-family="'Roboto Mono',monospace" font-size="58" font-weight="700">I</text>
  <text class="l6 nm" x="480.3" y="122" font-family="'Roboto Mono',monospace" font-size="58" font-weight="700">D</text>

  <!-- Accent dot + cursor -->
  <text class="dot-acc acc-f" x="523.1" y="122" font-family="'Roboto Mono',monospace" font-size="58" font-weight="700">.</text>
  <rect class="cur acc-f" x="568" y="70" width="9" height="54" rx="1"/>

  <!-- Underline accent, grows from centre -->
  <line class="uline acc-s" x1="340" y1="134" x2="460" y2="134" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Role -->
  <g class="role">
    <text class="role-t" x="400" y="164" font-family="'Roboto Mono',monospace" font-size="10" font-weight="400"
      text-anchor="middle" letter-spacing="5.5">RESEARCHER  ·  DEVELOPER  ·  AI/ML ENTHUSIAST</text>
  </g>

  <!-- Sub info -->
  <text class="sub0 sub-t" x="400" y="179" font-family="'Roboto Mono',monospace" font-size="9" font-weight="400"
    text-anchor="middle" letter-spacing="3">GREEN UNIVERSITY OF BANGLADESH  ·  CSE</text>
  <text class="sub1 mail-t" x="400" y="193" font-family="'Roboto Mono',monospace" font-size="8.5" font-weight="400"
    text-anchor="middle" letter-spacing="1">mdmuzahid0408@gmail.com</text>
</svg>
