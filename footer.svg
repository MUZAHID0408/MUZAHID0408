<svg width="800" height="164" viewBox="0 0 800 164" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="termGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="philoGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;700&amp;display=swap');

    /* ══ THEME TOKENS ══ (light = default, dark = media query) */
    :root{
      --accent:  #078a57;
      --edge:    rgba(31,35,40,0.18);
      --edge-lo: rgba(31,35,40,0.10);
      --osc:     0.55;                    /* oscilloscope trace opacity */
      --phil:    rgba(31,35,40,0.88);     /* philosophy quote           */
      --univ:    rgba(31,35,40,0.72);     /* education line             */
      --mail:    rgba(31,35,40,0.66);     /* email                      */
      --dim:     rgba(31,35,40,0.50);     /* @dev and $                 */
      --path:    #0969da;                 /* :~/open-to-collab          */
      --msg:     rgba(31,35,40,0.78);     /* terminal message           */
      --tbg:     rgba(31,35,40,0.04);     /* terminal box fill          */
      --tbd:     rgba(31,35,40,0.20);     /* terminal box border        */
    }
    @media (prefers-color-scheme: dark){
      :root{
        --accent:  #4af0a0;
        --edge:    rgba(255,255,255,0.10);
        --edge-lo: rgba(255,255,255,0.05);
        --osc:     0.22;
        --phil:    rgba(232,232,234,0.88);
        --univ:    rgba(232,232,234,0.55);
        --mail:    rgba(232,232,234,0.50);
        --dim:     rgba(232,232,234,0.40);
        --path:    rgba(100,175,245,0.95);
        --msg:     rgba(232,232,234,0.72);
        --tbg:     rgba(255,255,255,0.03);
        --tbd:     rgba(255,255,255,0.12);
      }
      .glow-t{filter:url(#termGlow)}
      .glow-p{filter:url(#philoGlow)}
    }

    @keyframes sweepL{0%{stroke-dashoffset:850;opacity:0}8%{opacity:1}100%{stroke-dashoffset:0}}
    @keyframes sweepR{0%{stroke-dashoffset:-850;opacity:0}8%{opacity:1}100%{stroke-dashoffset:0}}
    @keyframes oscDraw{0%{stroke-dashoffset:1200}100%{stroke-dashoffset:0}}
    @keyframes tickRapid{
      0%  {opacity:0;transform:scaleY(0)}
      50% {opacity:1;transform:scaleY(1.3)}
      100%{opacity:0.5;transform:scaleY(1)}
    }
    @keyframes waveA{
      0%  {opacity:0;transform:translateY(-8px);filter:blur(3px)}
      40% {opacity:0.6;transform:translateY(-2px);filter:blur(1px)}
      100%{opacity:0;transform:translateY(0);filter:blur(0)}
    }
    @keyframes waveB{
      0%  {opacity:0;transform:translateY(8px);filter:blur(3px)}
      40% {opacity:0.6;transform:translateY(2px);filter:blur(1px)}
      100%{opacity:0;transform:translateY(0);filter:blur(0)}
    }
    @keyframes philoResolve{
      0%  {opacity:0;filter:blur(6px)}
      35% {opacity:0}
      60% {opacity:0.5;filter:blur(2px)}
      100%{opacity:1;filter:blur(0)}
    }
    @keyframes philoShimmer{0%,100%{opacity:1}50%{opacity:0.78}}
    @keyframes uniScan{
      0%  {clip-path:inset(0 100% 0 0);opacity:0}
      6%  {opacity:1}
      100%{clip-path:inset(0 0% 0 0)}
    }
    @keyframes emailDecl{
      0%  {opacity:0;letter-spacing:8px;filter:blur(3px)}
      50% {opacity:0.6;letter-spacing:2px;filter:blur(1px)}
      100%{opacity:1;letter-spacing:1px;filter:blur(0)}
    }
    @keyframes divCenter{0%{clip-path:inset(0 50% 0 50%)}100%{clip-path:inset(0 0% 0 0%)}}
    @keyframes segType{
      0%  {clip-path:inset(0 100% 0 0);opacity:0}
      5%  {opacity:1}
      100%{clip-path:inset(0 0% 0 0)}
    }
    @keyframes blink{0%,100%{opacity:0.85}50%{opacity:0}}
    @keyframes botRule{0%{opacity:0}100%{opacity:1}}

    .rule-t-l { stroke-dasharray:850; animation:sweepL 0.9s cubic-bezier(.22,1,.36,1) 0.0s both }
    .rule-t-r { stroke-dasharray:850; animation:sweepR 0.9s cubic-bezier(.22,1,.36,1) 0.0s both }
    .osc      { stroke-dasharray:1200; animation:oscDraw 0.9s cubic-bezier(.22,1,.36,1) 0s both }
    .rule-b   { animation:botRule 0.5s ease 1.6s both }

    .tk0 { animation:tickRapid 0.4s ease 0.52s both; transform-origin:160px 1px }
    .tk1 { animation:tickRapid 0.4s ease 0.60s both; transform-origin:320px 1px }
    .tk2 { animation:tickRapid 0.4s ease 0.68s both; transform-origin:480px 1px }
    .tk3 { animation:tickRapid 0.4s ease 0.76s both; transform-origin:640px 1px }

    .wave-a  { animation:waveA 0.9s ease 0.4s both }
    .wave-b  { animation:waveB 0.9s ease 0.4s both }
    .philo   { animation:philoResolve 1.2s ease 0.4s both }
    .philo-sh{ animation:philoShimmer 5.5s ease-in-out 1.9s infinite }

    .univ    { animation:uniScan 0.9s steps(52,end) 0.95s both }
    .div-c   { animation:divCenter 0.5s ease 1.05s both }
    .email   { animation:emailDecl 0.7s ease 1.20s both }
    .tbox    { animation:divCenter 0.6s ease 1.00s both }

    .seg-user{ animation:segType 0.5s steps(7,end)  1.10s both }
    .seg-host{ animation:segType 0.3s steps(4,end)  1.35s both }
    .seg-path{ animation:segType 0.7s steps(17,end) 1.50s both }
    .seg-cmd { animation:segType 0.2s steps(1,end)  1.95s both }
    .seg-msg { animation:segType 1.0s steps(29,end) 2.05s both }
    .cur     { animation:blink 1.1s step-end 3.1s infinite }

    /* colour hooks */
    .acc-s{stroke:var(--accent)}
    .acc-f{fill:var(--accent)}
    .edge{stroke:var(--edge)}
    .edge-lo{stroke:var(--edge-lo)}
    .osc{stroke:var(--accent);stroke-opacity:var(--osc)}
    .tbox{fill:var(--tbg);stroke:var(--tbd)}

    /* typography (sizes +3) */
    .phil-txt{font-family:'Roboto Mono',monospace;font-size:17px;font-style:italic;font-weight:300;fill:var(--phil);text-anchor:middle;letter-spacing:0.4px}
    .univ-txt{font-family:'Roboto Mono',monospace;font-size:12px;font-weight:400;fill:var(--univ);text-anchor:middle;letter-spacing:2px}
    .mail-txt{font-family:'Roboto Mono',monospace;font-size:12px;fill:var(--mail);text-anchor:middle;letter-spacing:1px}
    .term    {font-family:'Roboto Mono',monospace;font-size:15px}
    .t-user{fill:var(--accent);font-weight:700}
    .t-dim {fill:var(--dim)}
    .t-path{fill:var(--path)}
    .t-msg {fill:var(--msg)}
  </style>

  <!-- Top rule: dual sweep from centre -->
  <line class="rule-t-l edge" x1="0"   y1="1" x2="400" y2="1" stroke-width="0.7"/>
  <line class="rule-t-r edge" x1="400" y1="1" x2="800" y2="1" stroke-width="0.7"/>

  <!-- Oscilloscope trace on the rule -->
  <path class="osc" stroke-width="0.8" fill="none"
    d="M0,1 L60,1 L65,-3 L70,5 L75,-3 L80,5 L83,1 L160,1 L163,-2 L167,4 L170,1 L320,1 L323,-2 L327,4 L330,1 L480,1 L483,-1 L487,3 L490,1 L640,1 L642,-1 L646,3 L648,1 L800,1"/>

  <!-- Tick marks -->
  <line class="tk0 acc-s" x1="160" y1="1" x2="160" y2="9" stroke-width="1.2"/>
  <line class="tk1 acc-s" x1="320" y1="1" x2="320" y2="9" stroke-width="1.2"/>
  <line class="tk2 acc-s" x1="480" y1="1" x2="480" y2="9" stroke-width="1.2"/>
  <line class="tk3 acc-s" x1="640" y1="1" x2="640" y2="9" stroke-width="1.2"/>

  <!-- Philosophy: interference ghosts, then resolve + gentle shimmer -->
  <text class="wave-a phil-txt" x="400" y="46">Learn deeply. Build purposefully. Improve constantly.</text>
  <text class="wave-b phil-txt" x="400" y="46">Learn deeply. Build purposefully. Improve constantly.</text>
  <g class="philo">
    <g class="philo-sh">
      <text class="phil-txt glow-p" x="400" y="46">Learn deeply. Build purposefully. Improve constantly.</text>
    </g>
  </g>

  <!-- Education -->
  <g class="univ">
    <text class="univ-txt" x="400" y="71">B.SC CSE · GREEN UNIVERSITY OF BANGLADESH · GRADUATE</text>
  </g>

  <!-- Divider -->
  <g class="div-c">
    <line class="edge-lo" x1="280" y1="85" x2="520" y2="85" stroke-width="0.7"/>
  </g>

  <!-- Email -->
  <text class="mail-txt email" x="400" y="107">mdmuzahid0408@gmail.com</text>

  <!-- Terminal prompt, framed -->
  <rect class="tbox" x="100" y="122" width="600" height="30" rx="4" stroke-width="0.8"/>

  <g class="seg-user"><text class="term t-user glow-t" x="123.5" y="142">muzahid</text></g>
  <g class="seg-host"><text class="term t-dim"  x="186.5" y="142">@dev</text></g>
  <g class="seg-path"><text class="term t-path glow-t" x="222.5" y="142">:~/open-to-collab</text></g>
  <g class="seg-cmd"> <text class="term t-dim"  x="384.5" y="142">$</text></g>
  <g class="seg-msg"> <text class="term t-msg"  x="402.5" y="142">reach out — ML · web · mobile</text></g>

  <!-- Blinking cursor -->
  <rect class="cur acc-f glow-t" x="667.5" y="127" width="8" height="18" rx="1"/>

  <!-- Bottom rule -->
  <line class="rule-b edge-lo" x1="0" y1="163" x2="800" y2="163" stroke-width="0.6"/>
</svg>
